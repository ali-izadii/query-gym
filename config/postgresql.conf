# Postgres config for the query-practice lab.
# Goal: realistic planner behaviour + readable EXPLAIN output, on a dev laptop.
# Tune shared_buffers / work_mem to your machine if needed.

listen_addresses = '*'
max_connections = 50

# --- memory ---
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 32MB
maintenance_work_mem = 512MB
temp_buffers = 32MB

# --- planner ---
random_page_cost = 1.1            # SSD
effective_io_concurrency = 200
default_statistics_target = 100
jit = off                         # keeps EXPLAIN ANALYZE output simpler/stabler

# --- parallelism (set max_parallel_workers_per_gather = 0 to force serial plans) ---
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 4

# --- wal / bulk load friendly (dev only, not crash-safe for production) ---
wal_level = minimal
max_wal_senders = 0
wal_compression = on
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
synchronous_commit = off
full_page_writes = on
fsync = on

# --- autovacuum ---
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- observability for query practice ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_functions = all
compute_query_id = on

log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 2000  # log anything slower than 2s
log_statement = 'none'
log_timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '

timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
